openapi: 3.1.0
info:
  title: Portfolio Contact API
  version: 1.0.0
  description: Sends portfolio contact form messages to the site owner's email.
servers:
  - url: https://{domain}
    variables:
      domain:
        default: your-deployment-domain.example
paths:
  /api/contact:
    post:
      operationId: sendContactMessage
      summary: Send a message to the portfolio owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name:
                  type: string
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 254
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        "200":
          description: Message sent to the portfolio owner's configured email.
        "400":
          description: Invalid form input.
        "405":
          description: Only POST is supported.
        "502":
          description: The email service failed or was unavailable.
        "503":
          description: Server-side email configuration is missing.
